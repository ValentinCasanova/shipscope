[project]
name = "shipscope-backend"
version = "0.1.0"
description = "ShipScope API: Django REST backend for rate shopping and order sync"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=50.0.1",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "pyjwt[crypto]>=2.15.0",
    "python-json-logger>=4.2.0",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-migration-linter>=6.0.0",
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = [
    # Mutable class attributes. Django and DRF read their options from class attributes,
    # such as a ModelAdmin's list_display or a model Meta's constraints, which are lists
    # by convention.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain assert statements, and tests use made-up secrets and tokens.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = [
    # WhiteNoise warns that STATIC_ROOT doesn't exist; tests don't run collectstatic.
    "ignore:No directory at:UserWarning",
]
