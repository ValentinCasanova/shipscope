# Local development services. Values come from the repo-root .env; create it with
# `cp .env.example .env`. Published ports are bound to 127.0.0.1, so other machines
# on the network can't connect to them.

name: shipscope

services:
  db:
    # Debian-based rather than Alpine, so text sorts with glibc locales as it does on
    # RDS. Keep the major version in step with RDS.
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h checks over TCP: on first start the image creates the database using a
      # temporary server that listens only on a Unix socket, so a socket check would
      # pass too early. -U and -d keep failed-login noise out of the server log, and
      # $$ leaves the variables for the container's shell to expand.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Probe every second during startup, then every 10 seconds once healthy.
      start_period: 30s
      start_interval: 1s

  backend:
    # The production image from backend/Dockerfile, with Django's development server in
    # place of Gunicorn. After changing dependencies, rebuild it with
    # `docker compose up --build`: the bind mount below updates code, not packages.
    build:
      context: ./backend
      target: runtime
    # Migrating on every start is a local convenience; deployed environments run
    # migrations as a one-off task. exec makes runserver PID 1, so it receives the stop
    # signal, which a shell running as PID 1 would ignore. 0.0.0.0 accepts connections
    # from outside the container.
    command: ["sh", "-c", "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"]
    env_file: .env
    environment:
      # Replaces localhost from .env: containers reach the database by its service name.
      POSTGRES_HOST: db
    volumes:
      # The source replaces the image's copy of the code, so runserver reloads on edits.
      # The virtualenv lives in /opt/venv, outside the mount.
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Vite's dev server with hot reload, for local development only; deployed
    # environments serve the output of `npm run build` as static files. After changing
    # dependencies, run `docker compose up --build -V` (see the node_modules volume below).
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # No env_file: the dev server only needs the proxy target, and none of the backend's
    # settings belong in the frontend container.
    environment:
      # The dev server forwards /api/ requests here. The browser only ever talks to
      # localhost:5173, so this address never reaches browser code.
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # An anonymous volume over the mounted folder's node_modules, so the container
      # keeps the packages the image installed. It is kept when the container is
      # recreated; -V replaces it with a fresh copy from the image.
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  # Survives `docker compose down` (`down -v` deletes it). The image applies the
  # POSTGRES_* values only when it initializes an empty volume.
  pgdata:
