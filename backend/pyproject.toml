[project]
name = "shipscope-backend"
version = "0.1.0"
description = "ShipScope API: Django REST backend for rate shopping and order sync"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain assert statements.
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = [
    # WhiteNoise warns that STATIC_ROOT doesn't exist; tests don't run collectstatic.
    "ignore:No directory at:UserWarning",
]
